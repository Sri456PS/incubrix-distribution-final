key: lemmy
version: 1.0.0
tier: native
auth: bot_token
surfaces:
  - key: community
    content_types: [text, image, video_link]
    spec: {title_max_chars: 200, body_max_chars: 10000, links_allowed: true}
rate_limits:
  per_connection: {requests: 60, per_seconds: 60}
capabilities: [publish, status, delete, metrics]
error_map: {"429": PLATFORM_RATE_LIMIT, "401": CONNECTION_AUTH_EXPIRED, "400": PLATFORM_CONTENT_REJECTED}
instance_param: base_url
